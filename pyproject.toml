[project]
name = "claude-hooks"
version = "0.1.0"
description = "CLI for managing composable community permission profiles for Claude Code hooks"
readme = "README.md"
authors = [
    { name = "Asher Liu", email = "boyu.liu47@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
license = "MIT"

[project.scripts]
claude-hooks = "claude_hooks.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
